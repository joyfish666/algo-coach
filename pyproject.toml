[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algocoach"
version = "0.1.0"
description = "Local LeetCode (leetcode.cn) practice workbench with an AI learning coach. Data, cookies and config stay on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "joyfish666" }]
keywords = ["leetcode", "algorithm", "interview", "practice", "ai-coach"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/joyfish666/algo-coach"
Repository = "https://github.com/joyfish666/algo-coach"
Changelog = "https://github.com/joyfish666/algo-coach/blob/main/CHANGELOG.md"

[project.scripts]
coach = "cli:main"

[tool.setuptools]
packages = ["lc", "lc.sites", "server"]
py-modules = ["cli"]

[tool.setuptools.package-data]
server = ["webdist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live-network tests (tests/test_integration_live.py) are opt-in:
#   pytest -m integration   (with ALGOCOACH_TEST_COOKIE set)
addopts = '-m "not integration"'
markers = [
    "integration: tests hitting the real network, run manually",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E9",   # syntax-level errors
    "F",    # pyflakes: undefined names, unused imports, f-string issues
    "W605", # invalid escape sequences
]

